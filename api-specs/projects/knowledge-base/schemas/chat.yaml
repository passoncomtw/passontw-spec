# OpenAI Chat Completions 相容結構，供閘道轉發與回傳
components:
  schemas:
    ChatCompletionRequest:
      type: object
      description: 與 OpenAI /v1/chat/completions 相容，閘道轉發至當前可用供應商
      properties:
        model:
          type: string
          description: 可為供應商別名或閘道統一 model 名（閘道會映射至當時使用的供應商）
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [system, user, assistant]
              content:
                type: string
        stream:
          type: boolean
          default: false
        max_tokens:
          type: integer

    ChatCompletionResponse:
      type: object
      description: 與 OpenAI 相容；可含 metadata 標註實際使用的 providerId
      properties:
        id:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              message:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
              finish_reason:
                type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
        providerId:
          type: string
          description: 實際回應的供應商 ID（閘道擴充欄位）

openapi: 3.0.3
info:
  title: POS System Backend API
  version: 1.0.0
  description: |
    POS 系統營運後台 API。

    提供管理員登入/登出、商家列表查詢功能。

servers:
  - url: http://localhost:8080
    description: 本地開發環境

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: 健康檢查
      tags: [system]
      security: []
      responses:
        '200':
          description: 服務正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: backend-service

  /ready:
    get:
      summary: 就緒檢查
      tags: [system]
      security: []
      responses:
        '200':
          description: 服務就緒
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  service:
                    type: string
                    example: backend-service

  /api/admin/auth/login:
    post:
      summary: 管理員登入
      description: 管理員帳號密碼登入，回傳 JWT Token
      tags: [admin-auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/common.yaml#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                $ref: './schemas/common.yaml#/components/schemas/LoginResponse'
        '401':
          description: 帳號或密碼錯誤
          content:
            application/json:
              schema:
                $ref: './schemas/common.yaml#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 帳號或密碼錯誤
                error_code: INVALID_CREDENTIALS

  /api/admin/auth/logout:
    post:
      summary: 管理員登出
      description: 管理員登出，後端回傳成功訊息，前端清除本地 Token
      tags: [admin-auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 登出成功
        '401':
          description: Token 無效
          content:
            application/json:
              schema:
                $ref: './schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/admin/merchants:
    get:
      summary: 取得商家列表
      description: 取得商家列表，支援分頁與關鍵字搜尋
      tags: [admin-merchant]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: 頁碼（最小值 1）
          schema:
            type: integer
            default: 1
            minimum: 1
            example: 1
        - name: limit
          in: query
          description: 每頁筆數（1～100）
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
            example: 10
        - name: search
          in: query
          description: 搜尋關鍵字（最長 255 字元）
          schema:
            type: string
            maxLength: 255
            example: 測試
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                $ref: './schemas/merchant.yaml#/components/schemas/MerchantListResponse'
        '400':
          description: 參數錯誤
          content:
            application/json:
              schema:
                $ref: './schemas/common.yaml#/components/schemas/ErrorResponse'
              examples:
                invalid_page:
                  summary: 頁碼錯誤
                  value:
                    success: false
                    message: 頁碼必須大於 0
                    error_code: INVALID_PARAMETERS
                    errors:
                      - field: page
                        message: 頁碼必須大於 0
                invalid_limit:
                  summary: 每頁筆數錯誤
                  value:
                    success: false
                    message: 每頁筆數必須介於 1~100
                    error_code: INVALID_PARAMETERS
                    errors:
                      - field: limit
                        message: 每頁筆數必須介於 1~100
        '401':
          description: Token 無效
          content:
            application/json:
              schema:
                $ref: './schemas/common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: 伺服器錯誤
          content:
            application/json:
              schema:
                $ref: './schemas/common.yaml#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 查詢失敗
                error_code: INTERNAL_ERROR
